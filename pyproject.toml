[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vagrant-mcp"
version = "0.1.0"
description = "MCP server that manages Vagrant VMs on remote hosts over SSH"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "paramiko>=3.5,<5",
]

[project.scripts]
vagrant-mcp = "vagrant_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]